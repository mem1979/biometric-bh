# ============================================================
# MÓDULO DE CONTROL DE PRESENTISMO Y ADICIONALES
# Configuración paramétrica de reglas de negocio y feature toggles
# Modificables por empresa sin requerir recompilación del sistema
# ============================================================
presentismo.habilitado=true
presentismo.politica=GENERAL

# Feature Toggles (Habilitadores de evaluación de reglas)
