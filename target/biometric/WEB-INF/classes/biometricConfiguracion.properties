# Limites permisibles en el período
presentismo.llegadas.tarde.max=2
presentismo.salidas.anticipadas.max=2
presentismo.jornadas.incompletas.max=2
presentismo.minutos.demora.acumulados.max=30
presentismo.ausencias.max=0

# ------------------------------------------------------------
# BANCO DE HORAS Y PRESENTISMO
# ------------------------------------------------------------
# Valor inicial del checkbox "Descontar Presentismo" al abrir el diálogo de Banco de Horas
presentismo.banco.horas.descontar.default=false

# Cantidad máxima de jornadas con descontarPresentismo=true permitidas en el período (0=0 toleradas, 1=1, 2=2, -1=deshabilitado)
presentismo.banco.horas.max=2

