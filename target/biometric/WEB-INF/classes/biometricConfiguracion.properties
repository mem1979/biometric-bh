# CONFIGURACIONES GLOBALES POR DEFECTO
# Tolerancia general en minutos para entradas y salidas (aplica si el turno no tiene una definida)
tolerancia.minutos=5
# Diferencia máxima (en minutos) para considerar una fichada como duplicada
duplicado.delta.min=5
# Máximo número de fichadas válidas por jornada (Entrada, Salida, Pausa, etc.)
max.registros.jornada=6
# ¿Cerrar automáticamente la jornada si no hay salida y se alcanza el límite horario?
jornada.autocierre=true
# Hora máxima (formato 0-23) para cierre automático si falta salida
jornada.hora.maxima=23
# ¿Permitir múltiples pausas en un mismo día?
pausa.multiple=false
# ¿Aceptar fichadas fuera del horario del turno (entrada/salida esperada)?
aceptar.fuera.turno=false
# ¿Registrar los movimientos que solo indican ubicación (sin entrada/salida)?
solo.ubicacion=true

# =============================
# REDONDEO AUTOMÁTICO DE HORAS
# =============================
# Intervalo de redondeo en minutos (ej: 5, 10, 15, 30)
redondeo.intervalo.minutos=30
# Estrategia por defecto: MATEMATICO, A_FAVOR_EMPLEADO, A_FAVOR_EMPRESA
redondeo.estrategia=MATEMATICO

# =============================
# TOLERANCIA AUTOMÁTICA
# =============================
# Habilitar aplicación automática de tolerancia en cálculo de horas
# Si está habilitada, las diferencias dentro de la tolerancia del turno no generan extras ni descuentos
tolerancia.automatica.habilitada=true

# Modo de aplicación de tolerancia
# BIDIRECCIONAL: aplica a excesos (evita extras) y faltantes (evita descuentos)
# SOLO_EXCESOS: solo evita extras por demoras pequeñas, no compensa faltantes
# SOLO_FALTANTES: solo evita descuentos por salidas anticipadas pequeñas, no elimina extras
tolerancia.automatica.modo=BIDIRECCIONAL

# Registrar en notas cuando se aplica tolerancia automática
tolerancia.automatica.registrar.nota=true


# =============================
# IMPUTACIÓN DE HORAS POR LICENCIA
# =============================
# Habilita la imputación automática de horas del turno para licencias con goce
licencia.imputar.horas.goce=true

# ¿Generar nota automática cuando se imputan horas por licencia?
licencia.imputar.registrar.nota=true

# =============================
# PORCENTAJES HORAS ADICIONALES
# =============================
# Porcentaje por defecto para horas extras (ej: 50 = 50% adicional sobre valor hora)
porcentaje.hora.extra.default=50
# Porcentaje por defecto para horas especiales/feriados (ej: 100 = 100% adicional)
porcentaje.hora.especial.default=100

